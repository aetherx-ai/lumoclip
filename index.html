<!doctype html>
<html lang="en">
  <head>
    <!-- =====================================================
         BASIC
    ====================================================== -->
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#050816"
    />

    <meta
      name="color-scheme"
      content="dark"
    />

    <!-- =====================================================
         GOOGLE SEARCH CONSOLE
    ====================================================== -->
    <meta
      name="google-site-verification"
      content="7ANJsW0LAZhSEeMM9PQyl82VjMWdTccjl_9Xvq-y6Dw"
    />

    <!-- =====================================================
         PRIMARY SEO

         Updated to reflect the full AI video toolkit — not just
         clipping. LumoClip also does AI Upscale, AI Reframe, AI
         Captions, Auto SFX, Enhanced Speech, and AI Dubbing, so the
         title/description/keywords now cover the whole suite. This
         is what search engines index and what shows in search
         results — matching it to the real feature set helps LumoClip
         rank for more queries than "video clipper" alone.
    ====================================================== -->

    <title>
      LumoClip - AI Video Editor: Clips, Upscale, Captions, Reframe & Dubbing
    </title>

    <meta
      name="description"
      content="LumoClip is an all-in-one AI video toolkit: turn long videos, podcasts, and YouTube content into short clips, upscale resolution with AI, add captions, auto sound effects, enhance speech, reframe for any platform, and dub into other languages — for YouTube Shorts, TikTok, and Instagram Reels."
    />

    <meta
      name="author"
      content="LumoClip"
    />

    <meta
      name="application-name"
      content="LumoClip"
    />

    <meta
      name="keywords"
      content="AI video clipper, AI video editor, AI video upscaler, video upscaling, AI video reframe, AI captions, auto sound effects, AI speech enhancement, AI video dubbing, video repurposing, YouTube Shorts, TikTok clips, Instagram Reels, podcast clips, script to video, LumoClip"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- =====================================================
         CANONICAL
    ====================================================== -->

    <link
      rel="canonical"
      href="https://lumo-clip.com/"
    />

    <!-- =====================================================
         FAVICON
         Uses the new LumoClip icon.

         A single "icon" link (no fixed "sizes") lets the browser
         scale one raster image for every context it needs, instead
         of fetching the same file five separate times for five
         declared sizes. Only apple-touch-icon needs its own entry
         since iOS ignores the generic <link rel="icon">.
    ====================================================== -->

    <link
      rel="icon"
      type="image/png"
      href="/lumoclip-icon.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/lumoclip-icon.png"
    />

    <!-- =====================================================
         PERFORMANCE
    ====================================================== -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- =====================================================
         OPEN GRAPH
    ====================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://lumo-clip.com/"
    />

    <meta
      property="og:site_name"
      content="LumoClip"
    />

    <meta
      property="og:title"
      content="LumoClip - AI Video Editor: Clips, Upscale, Captions, Reframe & Dubbing"
    />

    <meta
      property="og:description"
      content="Turn long videos, podcasts, and YouTube content into short-form clips — plus AI upscaling, captions, auto sound effects, speech enhancement, reframing, and dubbing, all with LumoClip AI."
    />

    <meta
      property="og:image"
      content="https://lumo-clip.com/lumoclip-og-image.png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="LumoClip - AI Video Editor: Clips, Upscale, Captions, Reframe & Dubbing"
    />

    <meta
      property="og:image:type"
      content="image/png"
    />

    <meta
      property="og:locale"
      content="en_US"
    />

    <!-- =====================================================
         TWITTER / X
    ====================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="LumoClip - AI Video Editor: Clips, Upscale, Captions, Reframe & Dubbing"
    />

    <meta
      name="twitter:description"
      content="Turn long videos, podcasts, and YouTube content into short-form clips — plus AI upscaling, captions, auto sound effects, speech enhancement, reframing, and dubbing, all with LumoClip AI."
    />

    <meta
      name="twitter:image"
      content="https://lumo-clip.com/lumoclip-og-image.png"
    />

    <meta
      name="twitter:image:alt"
      content="LumoClip - AI Video Editor"
    />

    <!-- =====================================================
         ORGANIZATION + WEBSITE SCHEMA
    ====================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://lumo-clip.com/#organization",
            "name": "LumoClip",
            "alternateName": "LumoClip AI",
            "url": "https://lumo-clip.com/",
            "logo": {
              "@type": "ImageObject",
              "@id": "https://lumo-clip.com/#logo",
              "url": "https://lumo-clip.com/lumoclip-icon.png",
              "contentUrl": "https://lumo-clip.com/lumoclip-icon.png",
              "width": 512,
              "height": 512,
              "caption": "LumoClip Logo"
            },
            "description": "LumoClip is an all-in-one AI video toolkit for clipping, upscaling, captioning, reframing, and dubbing video content.",
            "sameAs": [
              "https://twitter.com/lumoclip",
              "https://www.linkedin.com/company/lumoclip",
              "https://www.producthunt.com/products/lumoclip"
            ]
          },

          {
            "@type": "WebSite",
            "@id": "https://lumo-clip.com/#website",
            "url": "https://lumo-clip.com/",
            "name": "LumoClip",
            "alternateName": [
              "LumoClip AI",
              "Lumo Clip"
            ],
            "description": "LumoClip is an all-in-one AI video toolkit for clipping, upscaling, captioning, reframing, and dubbing video content.",
            "publisher": {
              "@id": "https://lumo-clip.com/#organization"
            },
            "inLanguage": "en"
          }
        ]
      }
    </script>

    <!-- =====================================================
         SOFTWARE APPLICATION SCHEMA

         featureList expanded to cover the full toolkit (Upscale,
         Reframe, Auto SFX, Enhanced Speech, Dubbing) instead of only
         the clipping features — this is what can surface as rich
         results and is also a relevance signal for the broader set
         of queries the site should be found for.
    ====================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "@id": "https://lumo-clip.com/#software",
        "name": "LumoClip",
        "alternateName": "LumoClip AI Video Clipper",
        "url": "https://lumo-clip.com/",
        "description": "LumoClip is an all-in-one AI video toolkit that clips, upscales, captions, reframes, and dubs video content for short-form platforms.",
        "applicationCategory": "MultimediaApplication",
        "applicationSubCategory": "Video Editing Software",
        "operatingSystem": "Web",
        "image": "https://lumo-clip.com/lumoclip-icon.png",
        "screenshot": "https://lumo-clip.com/lumoclip-icon.png",
        "brand": {
          "@type": "Brand",
          "name": "LumoClip",
          "logo": {
            "@type": "ImageObject",
            "url": "https://lumo-clip.com/lumoclip-icon.png"
          }
        },
        "publisher": {
          "@id": "https://lumo-clip.com/#organization"
        },
        "featureList": [
          "AI video clipping",
          "Long video to shorts",
          "Automatic highlight detection",
          "AI video upscaling",
          "AI video reframing",
          "AI captions",
          "Auto sound effects",
          "AI speech enhancement",
          "AI video dubbing",
          "Script to video",
          "Short-form video creation",
          "Video repurposing",
          "YouTube video clipping",
          "Social media video optimization"
        ]
      }
    </script>

    <!-- =====================================================
         APPLICATION
    ====================================================== -->

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="LumoClip"
    />

    <!-- =====================================================
         VITE / REACT
    ====================================================== -->

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
